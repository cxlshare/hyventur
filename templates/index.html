<!DOCTYPE html>
<html>
<head>
<title>{{ app_name }}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
<h1>{{ app_name }}</h1>
<h2>Running on Amazon ECS Fargate - test deploy</h2>
<p><b>Environment:</b> {{ environment }}</p>
<p><b>Region:</b> {{ region }}</p>
<p><b>S3 Bucket:</b> {{ bucket }}</p>
<p><b>Config source:</b> AWS Secrets Manager ({{ secret_name }}), KMS-encrypted</p>
<hr>
<img src="{{ image_url }}" width="700" alt="S3 Image">
</div>
</body>
</html>
